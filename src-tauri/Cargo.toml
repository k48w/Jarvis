[package]
name = "jarvis"
version = "8.0.0"
edition = "2021"
description = "Jarvis — Assistente desktop em Rust e Tauri 2 para Windows"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "unstable"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "query", "form", "stream", "multipart", "charset", "http2", "gzip"] }
futures-util = "0.3"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
sysinfo = "0.33"
keyring = { version = "3", features = ["windows-native"] }
open = "5"
sha2 = "0.10"
getrandom = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Power",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Security_Cryptography",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
